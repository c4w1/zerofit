[package]
name = "xtask"
description = "Repository automation: profile codegen and FitCSVTool ground truth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Ground-truth rule: expected fixture values must never come from our own
# decoder, so this crate must not depend on `zerofit` or `zerofit-profile`
# (enforced by a test in src/main.rs).
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zerofit-codegen = { path = "../crates/zerofit-codegen" }

[lints]
workspace = true
