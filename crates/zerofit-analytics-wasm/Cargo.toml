[package]
name = "zerofit-analytics-wasm"
description = "WebAssembly build of zerofit-analytics: FIT bytes in, activity summary JSON out (internal)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "=0.2.129"
zerofit-analytics = { workspace = true, features = ["fit", "serde"] }

# Same as the workspace lints, except `unsafe_code` is `deny` instead of
# `forbid`: `#[wasm_bindgen]` expands to unsafe FFI glue, allowed with a
# local `#[allow]` on the exported functions only. The published crates
# keep `forbid`.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
