name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p zerofit --all-targets --no-default-features -- -D warnings
      - run: cargo clippy -p zerofit-analytics --all-targets --no-default-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test -p zerofit --no-default-features

  codegen:
    name: generated profile code is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask codegen --check

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  no-std:
    name: no_std build (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p zerofit --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p zerofit-profile --target thumbv7em-none-eabihf
      - run: cargo build -p zerofit-analytics --no-default-features --target thumbv7em-none-eabihf
      - run: cargo build -p zerofit-fueling --target thumbv7em-none-eabihf

  wasm:
    name: WebAssembly build + node smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Must match the `wasm-bindgen` version pinned in
      # crates/zerofit-wasm/Cargo.toml.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo build -p zerofit-analytics --no-default-features --target wasm32-unknown-unknown
      - run: cargo build -p zerofit-fueling --target wasm32-unknown-unknown
      - run: cargo build -p zerofit-wasm --profile wasm-release --target wasm32-unknown-unknown
      - run: >
          wasm-bindgen --target nodejs --out-dir target/wasm-pkg
          target/wasm32-unknown-unknown/wasm-release/zerofit_wasm.wasm
      - run: node crates/zerofit-wasm/tests/smoke.mjs

  web:
    name: web app (check, build, Playwright e2e + axe)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Must match the `wasm-bindgen` version pinned in crates/zerofit-wasm/Cargo.toml.
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      # The 4-hour ride the in-browser timing test analyzes.
      - run: cargo run --release -p zerofit-bench --example synthetic-fit -- ../target/ride-4h.fit 14400
      - run: npm ci
      - run: npm run prepare-assets
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14

  pages-build:
    name: build site for GitHub Pages
    # Deploy only from main, and only when every check above passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [fmt, clippy, test, codegen, docs, no-std, wasm, msrv, web]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npm run prepare-assets
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

  pages-deploy:
    name: deploy to GitHub Pages
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p zerofit --all-features
      - run: cargo check -p zerofit --no-default-features
      - run: cargo check -p zerofit-profile
      - run: cargo check -p zerofit-analytics --all-features
      - run: cargo check -p zerofit-analytics --no-default-features
      - run: cargo check -p zerofit-fueling --all-features

  fuzz:
    name: fuzz smoke test (60 s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --locked
      - name: run each target
        working-directory: fuzz
        run: |
          for target in decode differential roundtrip; do
            mkdir -p corpus/$target && cp seeds/* corpus/$target/
            cargo fuzz run -O $target -- -max_total_time=60
          done
