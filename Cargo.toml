[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["ondemous"]
repository = "https://github.com/ondemous/zerofit"

[workspace.dependencies]
zerofit = { path = "crates/zerofit", version = "0.1.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# "Never panic on malformed input" is enforced by lints rather than review.
# Test code is exempted via clippy.toml (unit tests) or a crate-level
# `#![allow]` (integration tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
missing_panics_doc = "deny"
cast_possible_truncation = "deny"
